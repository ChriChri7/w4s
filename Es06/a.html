<html lang="it"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice JS</title>
    <style>
       body {
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #141e30, #243b55);
}

.container {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    padding: 2rem;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    text-align: center;
    width: 320px;
    border: 1px solid rgba(255,255,255,0.2);
}

h2 {
    color: white;
    margin-bottom: 20px;
    font-size: 1.8rem;
}

button {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,114,255,0.4);
}

button:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 6px 20px rgba(0,114,255,0.6);
}

#risultato-box {
    margin-top: 20px;
    padding: 12px;
    border-radius: 12px;
    min-height: 40px;
    font-weight: bold;
    animation: fadeIn 0.4s ease;
}


@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calcolatrice JS</h2>
    <button onclick="avviaCalcolo()">Avvia Calcolo</button>

    <div id="risultato-box" style="display: none;">
        <span id="messaggio"></span>
    </div>
</div>

<script>
    function avviaCalcolo() {
        const resBox = document.getElementById('risultato-box');
        const messaggio = document.getElementById('messaggio');
        
        // Reset interfaccia
        resBox.style.display = "none";
        resBox.className = "";

       
        const input1 = prompt("Inserisci il primo numero:");
        const input2 = prompt("Inserisci il secondo numero:");
        const operazione = prompt("Scegli l'operazione (+, -, *, /, **):");

        
        const num1 = Number(input1);
        const num2 = Number(input2);

        let risultato;
        let erroreMsg = "";

        
        if (input1 === null || input1.trim() === "" || isNaN(num1) || 
            input2 === null || input2.trim() === "" || isNaN(num2)) {
            erroreMsg = "Errore: Inserisci numeri validi!";
        } else if (!operazione) {
            erroreMsg = "Errore: Operazione non inserita!";
        } else {
            // 4. Logica switch switch (operazione) {
                case "+":
                    risultato = num1 + num2;
                    break;
                case "-":
                    risultato = num1 - num2;
                    break;
                case "*":
                    risultato = num1 * num2;
                    break;
                case "/":
                    if (num2 === 0) {
                        erroreMsg = "Errore: Divisione per zero!";
                    } else {
                        risultato = num1 / num2;
                    }
                    break;
                case "**":
                    risultato = num1 ** num2;
                    break;
                default:
                    erroreMsg = "Errore: Operatore '" + operazione + "' non valido!";
            }
        }

        // 5. Visualizzazione Risultato nel DOM
        resBox.style.display = "block";
        if (erroreMsg) {
            resBox.classList.add('error');
            messaggio.innerText = erroreMsg;
        } else {
            resBox.classList.add('success');
            messaggio.innerText = `Risultato: ${num1} ${operazione} ${num2} = ${risultato}`;
        }
    }
</script>



</body></html>
